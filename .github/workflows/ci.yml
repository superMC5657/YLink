# CI: 前端质量 + E2E 回归 + Rust/Tauri 跨平台门禁
#
# 架构原则:
# 1. PR 与 main 绝对同轨: 提 PR 与合并到 main 执行完全相同的检查 (quality + e2e)
# 2. 产物单源复用: quality 产出 frontend-dist 供后置 Job 直接下载, 杜绝重复编译
# 3. 按需全量门禁: PR 与 main 快速反馈，支持 workflow_call / workflow_dispatch 手动触发 Rust 跨平台检查
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write # e2e 失败报告上传

jobs:
  # =========================================================================
  # 阶段 1: 前端核心质量门禁与生产打包 (PR / main / 发版 必跑, 约 25 秒)
  # =========================================================================
  quality:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 一步全量体检: 契约守护 + ESLint + Stylelint + vue-tsc 类型 + Prettier 格式 + Vitest 单测
      - name: Code Quality & Unit Tests
        run: pnpm check

      # 一步生产打包: 验证 Rollup / Vite 生产构建正确性
      - name: Production Build
        run: pnpm build

      # 上传产物供 E2E / Rust 复用, 避免后置 Job 重复构建
      - name: Cache frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist
          retention-days: 1

  # =========================================================================
  # 阶段 2: 前端 E2E 端到端回归测试 (PR / main / 发版 必跑, 约 40 秒)
  # =========================================================================
  e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # =========================================================================
  # 阶段 3: Tauri / Rust 跨平台编译门禁 (发版 Tag 或手动触发时执行, 约 1~2 分钟)
  # =========================================================================
  rust:
    name: Rust Check (${{ matrix.os }})
    # PR 与常规 main push 专注于快速反馈; 仅在发版调用 (workflow_call) 或手动触发时启动双平台虚拟机
    if: github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch'
    needs: [quality]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file patchelf libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # 直接复用 quality 产出的 dist, 彻底免去在双系统上安装 Node/pnpm 与重复构建
      - name: Download frontend dist
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: dist

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Cargo Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
