# CI:前端 quality + e2e、Rust/Tauri 双平台检查门禁
# 骨架对齐 z-viewer(双系统矩阵 windows+ubuntu-22.04、apt 段、pnpm+node22、clippy+test)，
# 并保留 YLink 独有功能:
# 触发:
#   - PR → 轻量门禁(frontend-pr-gate:lint + typecheck)，快速反馈不拖慢开发
#   - workflow_call/workflow_dispatch → 全量 quality/e2e/rust(tag 全量检查只走 release-tauri.yml 开头复用的那次，避免双跑)
# 注:Go 后端按项目决策不走 GitHub Actions，推送检查走根目录 Makefile(make go-vet / go-test)，
#     见 docs/backend/README.md §9
name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write # upload-artifact(e2e 失败报告)

jobs:
  # ---------- 前端:PR 轻量门禁(仅 PR 触发,lint+typecheck 快速反馈) ----------
  frontend-pr-gate:
    name: Frontend PR gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22 # package.json engines >=20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  # ---------- 前端:quality(仅 tag;YLink 增强:lint+lint:css+typecheck+format:check+test,build:web 代替 build) ----------
  frontend-quality:
    name: Frontend quality
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22 # package.json engines >=20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Stylelint
        run: pnpm lint:css

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build:web

  # ---------- 前端:e2e(固定 Mock 环境,仅 tag) ----------
  frontend-e2e:
    name: Frontend e2e
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [frontend-quality]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # playwright.config.ts 在 CI 下用内置 chromium(channel 未设置)
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e
        run: pnpm e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ---------- Rust / Tauri(仅 tag;对齐 z-viewer:双系统 clippy+test,替代原单 windows check) ----------
  rust:
    name: Rust (Tauri) check (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Tauri v2 Linux 编译所需系统依赖 (与发版机保持一致)
      - name: Install Tauri Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file patchelf libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # tauri build.rs 校验 frontendDist(../dist) 存在,需先生成前端产物
      - name: Build frontend dist
        run: pnpm build:web

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Cargo tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
