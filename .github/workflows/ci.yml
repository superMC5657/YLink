# CI:前端 quality + e2e、Rust/Tauri 检查
# 触发:仅发布 tag(v*)(2026-08-12 调整:此前 push main/PR 每次提交都跑,日常开发
# 检查改为本地 pnpm lint/typecheck/test/format:check;只有打 tag 发布时才在 CI 全量检查)
# 注:Go 后端按项目决策不走 GitHub Actions(见 docs/backend/README.md §9)
name: CI

on:
  push:
    tags: ['v*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write # upload-artifact(e2e 失败报告)

jobs:
  # ---------- 前端:quality ----------
  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10 # lockfileVersion 9.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22 # package.json engines >=20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build:web

  # ---------- 前端:e2e(固定 Mock 环境) ----------
  frontend-e2e:
    name: Frontend e2e
    runs-on: ubuntu-latest
    needs: [frontend-quality]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # playwright.config.ts 在 CI 下用内置 chromium(channel 未设置)
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e
        run: pnpm e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ---------- Rust / Tauri ----------
  # 打包仅支持 Windows(2026-08-12 收窄),Rust 检查与打包平台保持一致,在 windows-latest 上跑
  rust:
    name: Rust (Tauri) check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # tauri build.rs 校验 frontendDist(../dist) 存在,需先生成前端产物
      - name: Build frontend dist
        run: pnpm build:web

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml
