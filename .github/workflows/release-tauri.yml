# CD:Tauri 三平台打包 → 签名 → 发布到公开产物仓库（供公网下载 + 更新）
#
# 方案(2026-08-12 确认):
#   - 代码仓库 private(不开源),产物发布到公开产物仓库,保证匿名下载与 gh-proxy 加速可行
#   - latest.json 的资产 url 统一加 gh-proxy.com 前缀加速国内更新;updater endpoints 见
#     src-tauri/tauri.conf.json(gh-proxy 优先,直连兑底)
#
# 触发:push tag v* 或手动 workflow_dispatch
# 需要配置的 repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY = 私钥(tauri signer sign 支持,base64 字符串)。
#     注意:本项目密钥**有密码**(见 .env.production 的 TAURI_SIGNING_PRIVATE_KEY_PASSWORD),
#     CI 必须同时配置 TAURI_SIGNING_PRIVATE_KEY_PASSWORD,否则 tauri build 无法解密私钥签名。
#     .env.production 是本机文件(已 gitignore),CI 读不到,需把 key 与 password 配到 GitHub secrets。
#   RELEASES_PAT = 对公开产物仓库有 contents:write 权限的 PAT(如 fine-grained token,
#     仅授给该仓库的 Contents: Read/Write)
# 待替换占位符(发布前必须替换,guard 会强制):
#   RELEASES_REPO → 公开产物仓库,如 myname/ylink-releases(workflow 内 + tauri.conf.json endpoints)
name: Release Tauri

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag(如 v0.2.0),手动发布时必填'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  # 占位符守卫:RELEASES_REPO 未替换前直接失败,防止误发布
  guard:
    name: Guard placeholders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check RELEASES_REPO placeholder
        run: |
          if grep -q '<RELEASES_REPO>' .github/workflows/release-tauri.yml src-tauri/tauri.conf.json; then
            echo "::error::RELEASES_REPO 仍是占位符。请在 release-tauri.yml 的 publish job env 与 tauri.conf.json plugins.updater.endpoints 中替换为真实公开产物仓库(如 myname/ylink-releases)后再发布"
            exit 1
          fi
          echo "占位符检查通过"

      - name: Check tag format
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ "$TAG" != v* ]]; then
            echo "::error::发布 tag 必须是 v* 格式(当前: $TAG)。请打 vX.Y.Z 格式的 tag 或手动发布时填写 Release tag 输入"
            exit 1
          fi
          echo "tag 检查通过: $TAG"

  build:
    name: Build ${{ matrix.target }}
    needs: [guard]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            target: linux-x86_64
            bundles: deb
            glob: 'src-tauri/target/release/bundle/deb/*.deb'
          - platform: windows-latest
            target: windows-x86_64
            bundles: nsis
            glob: 'src-tauri/target/release/bundle/nsis/*.exe'
          # macos-13 已退役(2025-11);macos-15-intel = x64 GA runner,产物 darwin-x86_64;
          # 如需 Apple Silicon 另加 macos-26(arm64) + darwin-aarch64
          - platform: macos-15-intel
            target: darwin-x86_64
            bundles: app
            glob: 'src-tauri/target/release/bundle/macos/*.app.tar.gz'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps (Tauri)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # beforeBuildCommand(pnpm build)自动执行;提供 TAURI_SIGNING_PRIVATE_KEY(+PASSWORD)时
      # tauri build 自动为每个 bundle 产物生成 .sig(createUpdaterArtifacts: true)
      - name: Build Tauri bundles (signed)
        run: pnpm tauri build --bundles ${{ matrix.bundles }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Windows runner 默认 pwsh,这里强制 bash(collect 步骤为 bash 语法)
      # 注意:不用项目根 dist/(那是 Vite web 产物目录,会污染 release 资产),用独立 artifacts/
      - name: Collect installer + signature
        shell: bash
        run: |
          set -e
          FILE=$(ls ${{ matrix.glob }} 2>/dev/null | head -1)
          if [ -z "$FILE" ]; then
            echo "::error::未找到 ${{ matrix.target }} 安装包: ${{ matrix.glob }}"
            exit 1
          fi
          mkdir -p "artifacts/${{ matrix.target }}"
          cp "$FILE" "artifacts/${{ matrix.target }}/"
          if [ -f "$FILE.sig" ]; then cp "$FILE.sig" "artifacts/${{ matrix.target }}/"; fi
          echo "file=$(basename "$FILE")" >> "$GITHUB_OUTPUT"
          echo "sig=$([ -f "$FILE.sig" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          # 不带尾斜杠,保留 <target>/ 子目录,供 publish 按平台合并
          name: dist-${{ matrix.target }}
          path: artifacts
          if-no-files-found: error

  publish:
    name: Publish to releases repo
    needs: [guard, build]
    runs-on: ubuntu-latest
    env:
      # 待替换:公开产物仓库(如 myname/ylink-releases),由 guard 强制
      RELEASES_REPO: <RELEASES_REPO>
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # 合并三平台产物生成 latest.json(url 带 gh-proxy.com 加速前缀);
      # file 传 basename(即 release 资产名),产物与 .sig 在 artifacts/<target>/ 下
      - name: Build latest.json
        run: |
          ASSETS='['
          for T in windows-x86_64 darwin-x86_64 linux-x86_64; do
            FILE=$(ls artifacts/$T/* 2>/dev/null | grep -v '\.sig$' | head -1 || true)
            if [ -z "$FILE" ]; then continue; fi
            ASSETS="${ASSETS}{\"target\":\"$T\",\"file\":\"$(basename "$FILE")\"},"
          done
          ASSETS="${ASSETS%,}]"
          node scripts/build-latest-json.mjs --repo "$RELEASES_REPO" --tag "$TAG" --assets "$ASSETS" --dir artifacts --output artifacts/latest.json

      - name: Publish GitHub release (releases repo)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          set -e
          # 同名 tag 已存在则删除重建(产物仓库每次发版全量替换)
          gh release delete "$TAG" --yes --cleanup-tag --repo "$RELEASES_REPO" || true
          cd artifacts
          # 产物名不含空格(YLink_<ver>_x64-setup.exe 等),可直接展开
          gh release create "$TAG" $(find . -type f -printf '%P ') \
            --repo "$RELEASES_REPO" \
            --title "YLink $TAG" \
            --notes "YLink $TAG 安装包与更新元数据。更新走 gh-proxy.com 镜像加速,客户端 updater 自动检查。" \
            --latest
