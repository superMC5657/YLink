# YLink API 配置（敏感项只经环境变量注入，见 docs/backend/deploy.md）
app:
  name: ylink-backend
  env: development            # development / production
  addr: ":8081"
  base_url: "http://localhost:8081"   # 用于拼接订阅链接/支付回调地址

database:
  dsn: "host=127.0.0.1 port=5433 user=ylink password=ylink_root dbname=ylink-backend sslmode=disable TimeZone=Asia/Shanghai"
  max_open: 50
  max_idle: 10

redis:
  addr: "127.0.0.1:6379"
  password: "ylink_redis"
  db: 0

jwt:
  secret: "dev-only-secret-please-override-0123456789abcdef"   # >= 32 字节；生产经 JWT_SECRET
  access_ttl: 2h
  refresh_ttl: 336h          # 14d

smtp:
  host: "smtp.qq.com"
  port: 465
  username: "${APP_SMTP_USERNAME}"
  password: "${APP_SMTP_PASSWORD}"
  from_name: "YLink"

payment:
  epay:                      # 易支付（彩虹兼容）
    gateway: "https://pay.example.com"
    pid: "${EPAY_PID}"
    key: "${EPAY_KEY}"
    methods: ["alipay", "wxpay"]

cors:
  # Web 端来源；Tauri 走原生 HTTP 不经 CORS。生产部署需把真实面板域名加入白名单。
  # 本地联调若以 https 访问(Vite https / Caddy 本地 TLS),需同时放行对应 https 来源。
  allow_origins: ["http://localhost", "https://localhost", "http://127.0.0.1", "https://127.0.0.1", "http://localhost:5174", "https://localhost:5174", "http://localhost:1420", "https://localhost:1420"]

log:
  level: info
  dir: ./logs

# 站点运营规则（settings 表初始化同款）
site:
  site_name: "YLink"
  invite_commission_rate: 30        # 普通用户佣金比例 %
  agent_commission_rate: 40         # 代理商佣金比例 %
  agent_required_valid_invites: 50  # 代理申请有效邀请数阈值
  commission_confirm_days: 3        # 佣金确认期（天）
  order_expire_minutes: 30          # 订单超时关闭（分钟）
