# YLink API 配置（敏感项只经环境变量注入，见 docs/backend/deploy.md）
app:
  name: ylink-backend
  env: development            # development / production
  addr: ":8081"
  base_url: "http://localhost:8081"   # 用于拼接订阅链接/支付回调地址
  version: "dev"              # 后端版本号（F20 管理端版本检查展示；部署时注入）

database:
  # DSN 整串经 APP_DATABASE_DSN 注入（本地开发由 scripts/dev.sh / dev-docker.sh 导出；
  # 形状：host=127.0.0.1 port=5433 user=ylink password=<口令> dbname=ylink-backend sslmode=disable TimeZone=Asia/Shanghai）
  dsn: "${APP_DATABASE_DSN}"
  max_open: 50
  max_idle: 10

redis:
  addr: "127.0.0.1:6379"
  password: "${APP_REDIS_PASSWORD}"
  db: 0

jwt:
  secret: "${APP_JWT_SECRET}"   # >= 32 字节；生产漏配/沿用开发默认值时 fail-fast 拒绝启动
  access_ttl: 2h
  refresh_ttl: 336h          # 14d

smtp:
  host: "smtp.qq.com"
  port: 465
  username: "${APP_SMTP_USERNAME}"
  password: "${APP_SMTP_PASSWORD}"
  from_name: "YLink"

payment:
  epay:                      # 易支付（彩虹兼容）
    gateway: "https://pay.example.com"
    pid: "${EPAY_PID}"
    key: "${EPAY_KEY}"
    methods: ["alipay", "wxpay"]

cors:
  # Web 端来源；Tauri 走原生 HTTP 不经 CORS。生产部署需把真实面板域名加入白名单。
  # 本地联调若以 https 访问(Vite https / Caddy 本地 TLS),需同时放行对应 https 来源。
  allow_origins: ["http://localhost", "https://localhost", "http://127.0.0.1", "https://127.0.0.1", "http://localhost:5174", "https://localhost:5174", "http://localhost:1420", "https://localhost:1420"]

log:
  level: info
  dir: ./logs

# 站点运营规则(站点名/邀请与代理佣金比例/代理条件/佣金确认期/订单超时)不在本文件维护:
# 唯一来源是 settings 表(0001 迁移种子 + 管理端「站点设置」可改,运行时 Redis 缓存 60s),
# 见 docs/backend/data-model.md §4 与 docs/backend/README.md §8。

# 安全部署项（F22）：全部启动注入，生产环境优先用 APP_SECURITY_* 环境变量覆盖
security:
  admin_path: "admin"       # 管理端 API 路径段（/api/v1/{admin_path}/...），改后前端需同步 VITE_ADMIN_PATH 构建重打包
  subscribe_path: "client"  # 订阅下发路径段（/api/v1/{subscribe_path}/subscribe/{token}），订阅 URL 由服务端拼接下发
  safe_mode: false          # 开启后仅白名单域名可访问 API（App.base_url 的 host 自动纳入）
  safe_domains: []          # 追加白名单域名，如 ["panel.example.com", "sub.example.com"]

# 在线更新（F20 子集）：仅版本检查 + 变更日志展示，自动执行升级不立项
update:
  manifest_url: ""          # 更新源 URL，返回 {"version":"x.y.z","notes":"变更日志"}；空=不做远端检查
