# Prometheus 抓取配置(compose 内网直连 api/worker/node-exporter 容器,不经公网网关)
# 用法:docker compose --profile obs up -d(见 deploy.md §5)
# 数据保留半年:docker-compose.yml 中 --storage.tsdb.retention.time=180d(原默认 15d)。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 告警规则(进程存活/错误率/磁盘/CPU/内存),命中后推给 alertmanager 邮件通知
rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: ylink-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8081"]
        labels:
          service: ylink-api

  - job_name: ylink-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:8082"]
        labels:
          service: ylink-worker

  - job_name: node
    metrics_path: /metrics
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: node-exporter
