# Prometheus 抓取配置(compose 内网直连 api 容器,不经公网网关)
# 用法:docker compose --profile obs up -d(见 deploy.md §5)
# worker 不暴露 metrics 端点,不纳入抓取。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ylink-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8081"]
        labels:
          service: ylink-api
