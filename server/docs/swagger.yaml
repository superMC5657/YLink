              type: object
      security:
      - BearerAuth: []
      summary: 知识库分类列表（language 为空返回全部，含文档计数）
      tags:
      - 管理端
    post:
      consumes:
      - application/json
      parameters:
      - description: 请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.AdminKnowledgeCategoryReq'
