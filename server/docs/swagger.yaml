basePath: /api/v1
definitions:
  model.AdjustBalanceReq:
    properties:
      amount:
        description: 元，可正可负
        type: number
      remark:
        type: string
    required:
    - amount
    type: object
  model.AdminApproveReq:
    properties:
      remark:
        type: string
    type: object
  model.AdminBatchFailedItem:
    properties:
      id:
        type: integer
      reason:
        type: string
    type: object
  model.AdminBatchServerReq:
    properties:
      action:
        enum:
        - delete
        - update
        type: string
      group_id:
        type: integer
      ids:
        items:
          type: integer
        maxItems: 500
        minItems: 1
        type: array
      is_show:
        type: boolean
      rate:
        type: number
      status:
        enum:
        - 1
        - 2
        - 3
        type: integer
    required:
    - action
    - ids
    type: object
  model.AdminBatchServerResp:
    properties:
      failed:
        items:
          $ref: '#/definitions/model.AdminBatchFailedItem'
        type: array
      success:
        type: integer
    type: object
  model.AdminBatchUserReq:
    properties:
      action:
        enum:
        - ban
        - unban
        - adjust_balance
        type: string
      amount:
        description: adjust_balance 必填（元，可正可负）
        type: number
      ids:
        items:
          type: integer
        maxItems: 500
        minItems: 1
        type: array
      remark:
        type: string
    required:
    - action
    - ids
    type: object
  model.AdminBatchUserResp:
    properties:
      failed:
        items:
          $ref: '#/definitions/model.AdminBatchFailedItem'
        type: array
      success:
        type: integer
    type: object
  model.AdminKnowledgeCategoryItem:
    properties:
      id:
        type: integer
      knowledge_count:
        type: integer
      language:
        type: string
      name:
        type: string
      sort:
        type: integer
    type: object
  model.AdminKnowledgeCategoryReq:
    properties:
      language:
        maxLength: 10
        type: string
      name:
        maxLength: 64
        type: string
      sort:
        type: integer
    required:
    - language
    - name
    type: object
  model.AdminKnowledgeCategoryUpdateReq:
    properties:
      name:
        maxLength: 64
        type: string
      sort:
        type: integer
    required:
    - name
    type: object
  model.AdminKnowledgeItem:
    properties:
      body:
        type: string
      category:
        type: string
      id:
        type: integer
      is_show:
        type: boolean
      language:
        type: string
      sort:
        type: integer
      title:
        type: string
      updated_at:
        type: string
    type: object
  model.AdminMailTemplateItem:
    properties:
      body:
        type: string
      is_custom:
        type: boolean
      name:
        type: string
      placeholders:
        items:
          type: string
        type: array
      remark:
        type: string
      subject:
        type: string
      updated_at:
        type: string
    type: object
  model.AdminMailTemplateReq:
    properties:
      body:
        type: string
      subject:
        maxLength: 255
        type: string
    required:
    - body
    - subject
    type: object
  model.AdminMailTemplateTestReq:
    properties:
      to_email:
        type: string
    required:
    - to_email
    type: object
  model.AdminNoticeItem:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      is_show:
        type: boolean
      sort:
        type: integer
      title:
        type: string
    type: object
  model.AdminOverviewResp:
    properties:
      agent_count:
        type: integer
      completed_orders:
        type: integer
      order_count:
        type: integer
      plan_count:
        type: integer
      today_revenue:
        description: 今日实收（元）
        type: number
      total_balance:
        description: 全体用户余额合计（元）
        type: number
      total_revenue:
        description: 已完成订单实收合计（元）
        type: number
      user_count:
        type: integer
    type: object
  model.AdminSendMailReq:
    properties:
      body:
        maxLength: 10000
        type: string
      ids:
        items:
          type: integer
        maxItems: 100
        minItems: 1
        type: array
      subject:
        maxLength: 200
        type: string
    required:
    - body
    - ids
    - subject
    type: object
  model.AdminSendMailResp:
    properties:
      failed:
        items:
          $ref: '#/definitions/model.AdminBatchFailedItem'
        type: array
      sent:
        type: integer
    type: object
  model.AdminServerView:
    properties:
      config:
        type: string
      group_id:
        type: integer
      host:
        type: string
      id:
        type: integer
      is_online:
        type: boolean
      is_show:
        type: boolean
      last_heartbeat_at:
        type: integer
      name:
        type: string
      node_key:
        description: 节点上报密钥(X-Node-Key)
        type: string
      port:
        type: integer
      rate:
        type: number
      sort:
        type: integer
      status:
        type: integer
      system:
        $ref: '#/definitions/model.NodeSystemStats'
      tags:
        items:
          type: string
        type: array
      type:
        type: string
    type: object
  model.AdminSettingsReq:
    properties:
      key:
        type: string
      value:
        description: JSON 字符串
        type: string
    required:
    - key
    - value
    type: object
  model.AdminSortItem:
    properties:
      id:
        type: integer
      sort:
        type: integer
    required:
    - id
    type: object
  model.AdminSortReq:
    properties:
      items:
        items:
          $ref: '#/definitions/model.AdminSortItem'
        maxItems: 500
        minItems: 1
        type: array
    required:
    - items
    type: object
  model.AdminSortServerReq:
    properties:
      items:
        items:
          $ref: '#/definitions/model.AdminSortItem'
        maxItems: 500
        minItems: 1
        type: array
    required:
    - items
    type: object
  model.AdminStatNodeTraffic:
    properties:
      bytes:
        description: 上报累计值合计（未乘倍率，节点全周期）
        type: integer
      name:
        type: string
      server_id:
        type: integer
    type: object
  model.AdminStatOrderPoint:
    properties:
      balance_refunded:
        description: 当日退款订单余额部分（元，按 updated_at 近似）
        type: number
      balance_used:
        description: 当日完成订单余额支付部分（元，按 paid_at）
        type: number
      completed_count:
        description: 当日完成订单数
        type: integer
      date:
        type: string
      order_count:
        description: 当日创建订单数
        type: integer
      refunded:
        description: 当日退款现金部分（元，按 updated_at 近似）
        type: number
      revenue:
        description: 当日实收现金部分（元，按 paid_at）
        type: number
    type: object
  model.AdminStatOrdersResp:
    properties:
      days:
        type: integer
      items:
        description: 含无数据日补零，便于折线图
        items:
          $ref: '#/definitions/model.AdminStatOrderPoint'
        type: array
    type: object
  model.AdminStatPlanSlice:
    properties:
      plan_id:
        type: integer
      plan_name:
        type: string
      users:
        type: integer
    type: object
  model.AdminStatTrafficResp:
    properties:
      days:
        type: integer
      node_top:
        description: 节点流量分布 TopN
        items:
          $ref: '#/definitions/model.AdminStatNodeTraffic'
        type: array
      user_top:
        description: 流量消耗 TopN
        items:
          $ref: '#/definitions/model.AdminStatUserTraffic'
        type: array
    type: object
  model.AdminStatUserPoint:
    properties:
      count:
        type: integer
      date:
        type: string
    type: object
  model.AdminStatUserTraffic:
    properties:
      email:
        type: string
      total_bytes:
        description: 时间范围内 u+d 合计
        type: integer
      user_id:
        type: integer
    type: object
  model.AdminStatUsersResp:
    properties:
      days:
        type: integer
      plan_distribution:
        items:
          $ref: '#/definitions/model.AdminStatPlanSlice'
        type: array
      register_trend:
        description: 含无数据日补零
        items:
          $ref: '#/definitions/model.AdminStatUserPoint'
        type: array
    type: object
  model.AdminSubscriptionTemplateItem:
    properties:
      content:
        type: string
      is_custom:
        type: boolean
      name:
        type: string
      remark:
        type: string
      updated_at:
        type: string
      variables:
        items:
          type: string
        type: array
    type: object
  model.AdminSubscriptionTemplatePreviewResp:
    properties:
      content:
        type: string
      name:
        type: string
    type: object
  model.AdminSubscriptionTemplateReq:
    properties:
      content:
        type: string
    required:
    - content
    type: object
  model.AdminTelegramWebhookSetupResp:
    properties:
      message:
        type: string
      webhook_url:
        type: string
    type: object
  model.AdminTrafficResetReq:
    properties:
      mode:
        enum:
        - clear_usage
        - reset_quota
        type: string
      user_ids:
        items:
          type: integer
        maxItems: 500
        minItems: 1
        type: array
    required:
    - mode
    - user_ids
    type: object
  model.AdminTrafficResetResp:
    properties:
      failed:
        items:
          $ref: '#/definitions/model.AdminBatchFailedItem'
        type: array
      success:
        type: integer
    type: object
  model.AdminVersionResp:
    properties:
      has_update:
        type: boolean
      latest:
        type: string
      notes:
        type: string
      version:
        type: string
    type: object
  model.AgentCondition:
    properties:
      met:
        type: boolean
      text:
        type: string
    type: object
  model.AgentPolicyResp:
    properties:
      benefits:
        items:
          type: string
        type: array
      commission_rate:
        type: integer
      notes:
        items:
          type: string
        type: array
      required_valid_invites:
        type: integer
    type: object
  model.AgentStatusResp:
    properties:
      apply_status:
        description: none/pending/approved/rejected
        type: string
      conditions:
        items:
          $ref: '#/definitions/model.AgentCondition'
        type: array
      is_agent:
        type: boolean
      qualified:
        type: boolean
      required_valid_invites:
        type: integer
      valid_invites:
        type: integer
    type: object
  model.AuthLoginReq:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  model.AuthRegisterReq:
    properties:
      email:
        type: string
      email_code:
        type: string
      invite_code:
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - email_code
    - password
    type: object
  model.CaptchaReq:
    properties:
      email:
        type: string
      type:
        enum:
        - register
        - forgot
        type: string
    required:
    - email
    - type
    type: object
  model.CaptchaResp:
    properties:
      expire_in:
        type: integer
      resend_after:
        type: integer
    type: object
  model.ChangePasswordReq:
    properties:
      new_password:
        maxLength: 72
        minLength: 8
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  model.CheckoutReq:
    properties:
      method:
        type: string
    required:
    - method
    type: object
  model.CheckoutResp:
    properties:
      content:
        type: string
      expire_in:
        type: integer
      type:
        type: string
    type: object
  model.CouponAvailableResp:
    properties:
      list:
        items:
          $ref: '#/definitions/model.CouponItem'
        type: array
    type: object
  model.CouponCheckReq:
    properties:
      code:
        type: string
      period:
        enum:
        - month
        - quarter
        - half_year
        - year
        - onetime
        type: string
      plan_id:
        type: integer
    required:
    - code
    - period
    - plan_id
    type: object
  model.CouponCheckResp:
    properties:
      discount_amount:
        type: number
      pay_amount:
        type: number
      valid:
        type: boolean
    type: object
  model.CouponItem:
    properties:
      code:
        type: string
      ended_at:
        type: string
      min_spend:
        description: 元
        type: number
      plan_ids:
        description: 空=全部套餐
        items:
          type: integer
        type: array
      started_at:
        type: string
      type:
        description: 1=固定金额 2=百分比
        type: integer
      valid_periods:
        description: 空=不限周期
        items:
          type: string
        type: array
      value:
        description: type=1 为元；type=2 为百分比数值（如 10 表示 10%）
        type: number
    type: object
  model.CreateOrderReq:
    properties:
      coupon_code:
        type: string
      period:
        enum:
        - month
        - quarter
        - half_year
        - year
        - onetime
        type: string
      plan_id:
        type: integer
    required:
    - period
    - plan_id
    type: object
  model.CreateTicketReq:
    properties:
      level:
        enum:
        - 0
        - 1
        - 2
        type: integer
      message:
        type: string
      subject:
        maxLength: 128
        minLength: 1
        type: string
    required:
    - message
    - subject
    type: object
  model.ForgotReq:
    properties:
      email:
        type: string
      email_code:
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - email_code
    - password
    type: object
  model.InviteCodeItem:
    properties:
      code:
        type: string
      created_at:
        type: string
      used_count:
        type: integer
    type: object
  model.InviteCodesResp:
    properties:
      limit:
        type: integer
      list:
        items:
          $ref: '#/definitions/model.InviteCodeItem'
        type: array
      register_url_prefix:
        description: |-
          RegisterURLPrefix 注册链接路径后缀(如 /#/register?code=):不含域名,
          完整链接由前端按当前页面 origin 拼接;本字段仅为契约占位,前端不消费其值。
        type: string
    type: object
  model.InviteSummaryResp:
    properties:
      commission_balance:
        type: number
      commission_rate:
        type: integer
      pending_commission:
        type: number
      registered_count:
        type: integer
      total_commission:
        type: number
    type: object
  model.Knowledge:
    properties:
      body:
        type: string
      category:
        type: string
      id:
        type: integer
      language:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  model.KnowledgeCategory:
    properties:
      id:
        type: integer
      language:
        type: string
      name:
        type: string
      sort:
        type: integer
    type: object
  model.KnowledgeGroup:
    properties:
      category:
        type: string
      items:
        items:
          $ref: '#/definitions/model.KnowledgeItem'
        type: array
    type: object
  model.KnowledgeItem:
    properties:
      id:
        type: integer
      title:
        type: string
      updated_at:
        type: string
    type: object
  model.NodeSystemStats:
    properties:
      connections:
        description: 主机级 TCP 表项近似值，含系统噪声，不代表代理在线用户，仅供负载参考
        type: integer
      cpu_percent:
        type: number
      disk_percent:
        type: number
      memory_percent:
        type: number
      net_speed_in:
        description: 瞬时下行带宽(B/s)
        type: integer
      net_speed_out:
        description: 瞬时上行带宽(B/s)
        type: integer
      uptime:
        description: 开机时长(秒)
        type: integer
    type: object
  model.OrderDetailResp:
    properties:
      amount:
        type: number
      balance_used:
        type: number
      coupon_code:
        type: string
      created_at:
        type: string
      discount_amount:
        type: number
      order_no:
        type: string
      paid_at:
        type: string
      pay_amount:
        type: number
      pay_method:
        type: string
      period:
        type: string
      plan_name:
        type: string
      status:
        type: integer
    type: object
  model.OrderResp:
    properties:
      amount:
        type: number
      created_at:
        type: string
      discount_amount:
        type: number
      order_no:
        type: string
      pay_amount:
        type: number
      period:
        type: string
      plan_name:
        type: string
      status:
        type: integer
    type: object
  model.PaymentMethod:
    properties:
      code:
        type: string
      enabled:
        type: boolean
      icon:
        type: string
      name:
        type: string
    type: object
  model.PlanPrices:
    properties:
      half_year:
        type: number
      month:
        type: number
      onetime:
        type: number
      quarter:
        type: number
      year:
        type: number
    type: object
  model.PlanResp:
    properties:
      content:
        type: string
      device_limit:
        type: integer
      id:
        type: integer
      name:
        type: string
      prices:
        $ref: '#/definitions/model.PlanPrices'
      sort:
        type: integer
      speed_limit:
        type: integer
      traffic_gb:
        type: integer
    type: object
  model.RefreshReq:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  model.RefundReq:
    properties:
      gateway_refund_id:
        description: 外部网关退款单号:现金支付需线下在网关侧退款后回填,仅审计留痕,系统不做网关调用
        type: string
      remark:
        type: string
    type: object
  model.ReplyTicketReq:
    properties:
      message:
        type: string
    required:
    - message
    type: object
  model.ServerGroupResp:
    properties:
      group:
        type: string
      servers:
        items:
          $ref: '#/definitions/model.ServerResp'
        type: array
    type: object
  model.ServerResp:
    properties:
      id:
        type: integer
      name:
        type: string
      rate:
        type: number
      status:
        type: integer
      tags:
        items:
          type: string
        type: array
      type:
        type: string
    type: object
  model.SiteConfigResp:
    properties:
      agent_policy:
        $ref: '#/definitions/model.AgentPolicyResp'
      app_downloads:
        additionalProperties:
          type: string
        type: object
      background_url:
        description: 品牌背景图 URL(空=默认,F19)
        type: string
      customer_service_url:
        type: string
      free_traffic_tips:
        type: string
      invite_code_required:
        type: boolean
      languages:
        items:
          type: string
        type: array
      payment_methods:
        items:
          $ref: '#/definitions/model.PaymentMethod'
        type: array
      primary_color:
        description: 品牌主色(Hex,空=默认,F19)
        type: string
      register_enabled:
        type: boolean
      site_description:
        type: string
      site_logo:
        type: string
      site_name:
        type: string
      telegram:
        $ref: '#/definitions/model.TelegramInfo'
    type: object
  model.TelegramBindCodeResp:
    properties:
      bot_username:
        type: string
      code:
        type: string
      ttl_minutes:
        type: integer
    type: object
  model.TelegramInfo:
    properties:
      bot_url:
        type: string
      group_url:
        type: string
    type: object
  model.TicketDetailResp:
    properties:
      created_at:
        type: string
      id:
        type: integer
      level:
        type: integer
      messages:
        items:
          $ref: '#/definitions/model.TicketMsgResp'
        type: array
      reopen_count:
        type: integer
      status:
        type: integer
      subject:
        type: string
      type:
        type: integer
      withdraw:
        allOf:
        - $ref: '#/definitions/model.TicketWithdrawInfo'
        description: Withdraw 提现工单附带的结构化提现信息（type=1 时非空，F02）
    type: object
  model.TicketListItem:
    properties:
      created_at:
        type: string
      id:
        type: integer
      last_reply_at:
        type: string
      level:
        type: integer
      reopen_count:
        type: integer
      status:
        type: integer
      subject:
        type: string
      type:
        description: 0=普通 1=佣金提现(F02)
        type: integer
    type: object
  model.TicketMsgResp:
    properties:
      created_at:
        type: string
      id:
        type: integer
      message:
        type: string
      sender_type:
        type: integer
    type: object
  model.TicketWithdrawInfo:
    properties:
      account:
        type: string
      amount:
        type: number
      created_at:
        type: string
      id:
        type: integer
      method:
        type: string
      review_remark:
        type: string
      reviewed_at:
        type: string
      status:
        description: 0=处理中 1=已发放 2=已退回
        type: integer
      user_id:
        type: integer
    type: object
  model.TokenResp:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
      user:
        $ref: '#/definitions/model.UserBrief'
    type: object
  model.TrafficImportItem:
    properties:
      d:
        type: integer
      date:
        description: YYYY-MM-DD
        type: string
      u:
        type: integer
      user_id:
        type: integer
    required:
    - date
    - user_id
    type: object
  model.TrafficImportReq:
    properties:
      items:
        items:
          $ref: '#/definitions/model.TrafficImportItem'
        minItems: 1
        type: array
    required:
    - items
    type: object
  model.TrafficLog:
    properties:
      d:
        type: integer
      date:
        type: string
      u:
        type: integer
    type: object
  model.TransferReq:
    properties:
      amount:
        type: number
    required:
    - amount
    type: object
  model.TransferResp:
    properties:
      balance:
        type: number
      commission_balance:
        type: number
    type: object
  model.UniProxyBaseConfig:
    properties:
      pull_interval:
        type: integer
      push_interval:
        type: integer
