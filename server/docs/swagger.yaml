host: api.example.com
info:
  contact: {}
  description: 代理订阅售卖系统后端 API。统一信封 {code,message,data}；鉴权 Bearer <access_token>。
  title: YLink API
  version: "1.0"
paths:
  /admin/audit-logs:
    get:
      parameters:
      - description: 操作人用户 ID
        in: query
        name: admin_id
        type: integer
      - description: 动作（如 ban_user/adjust_balance）
        in: query
        name: action
        type: string
      - description: 目标（如用户 ID 字符串）
        in: query
        name: target
        type: string
      - description: 起始日期 YYYY-MM-DD（含）
        in: query
        name: from
        type: string
      - description: 结束日期 YYYY-MM-DD（含）
        in: query
        name: to
        type: string
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页条数（≤100）
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/resp.Body'
            - properties:
                data:
                  $ref: '#/definitions/resp.Page'
              type: object
      security:
      - BearerAuth: []
      summary: 审计日志分页查询（只读）
      tags:
      - 管理端
  /admin/knowledge-categories:
    get:
      parameters:
      - description: 语言（zh-CN/en-US，空=全部）
